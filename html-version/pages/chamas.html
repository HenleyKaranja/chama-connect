<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chamas — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <div class="flex justify-between items-center mb-lg">
    <div><h1 style="font-size:1.75rem;font-weight:700">Chamas</h1><p style="color:var(--muted-foreground)">Browse and join savings groups.</p></div>
    <button class="btn btn-primary" onclick="openCreate()" id="createBtn" style="display:none">+ New chama</button>
  </div>
  <div id="list" class="grid grid-cols-2 gap-4">Loading…</div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
let chamas = [];
async function refresh() {
  chamas = await API.get("/api/chamas");
  document.getElementById("list").innerHTML = chamas.map(c => `
    <div class="card">
      <div class="flex justify-between items-start"><div>
        <h3 class="card-title">${escapeHtml(c.name)}</h3>
        <p style="color:var(--muted-foreground);font-size:.875rem">${escapeHtml(c.description || "")}</p>
      </div>${c.is_member ? badge("member") : ""}</div>
      <div class="flex justify-between mt-md" style="font-size:.875rem">
        <div><div style="color:var(--muted-foreground)">Contribution</div><div class="font-semibold">${fmtKES(c.contribution_amount)} / ${escapeHtml(c.contribution_frequency)}</div></div>
        <div><div style="color:var(--muted-foreground)">Total savings</div><div class="font-semibold">${fmtKES(c.total_savings)}</div></div>
      </div>
      <div class="flex gap-2 mt-md">
        ${c.is_member
          ? `<button class="btn btn-outline btn-sm" onclick="leave('${c.id}')">Leave</button>`
          : `<button class="btn btn-primary btn-sm" onclick="join('${c.id}')">Join</button>`}
      </div>
    </div>`).join("") || "<p>No chamas yet.</p>";
}
async function join(id) {
  try { await API.post(`/api/chamas/${id}/join`); showToast("Joined", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
async function leave(id) {
  if (!confirm("Leave this chama?")) return;
  try { await API.del(`/api/chamas/${id}/leave`); showToast("Left", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
function openCreate() {
  showDetails("New chama", `
    <div class="form-group"><label class="form-label">Name</label><input id="cn" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Description</label><input id="cd" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Contribution amount (KES)</label><input id="ca" type="number" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Frequency</label><select id="cf" class="form-input"><option>monthly</option><option>weekly</option></select></div>
  `, [{ label: "Cancel" }, { label: "Create", primary: true, onClick: "createChama()" }]);
}
async function createChama() {
  try {
    await API.post("/api/chamas", {
      name: document.getElementById("cn").value, description: document.getElementById("cd").value,
      contribution_amount: parseFloat(document.getElementById("ca").value) || 0,
      contribution_frequency: document.getElementById("cf").value,
    });
    document.getElementById("__detailsModal").style.display = "none";
    showToast("Created", "success"); refresh();
  } catch (e) { showToast(e.message, "error"); }
}
(async () => {
  const me = await Auth.requireAuth(); await mountShell("chamas");
  if (me.role === "admin") document.getElementById("createBtn").style.display = "";
  refresh();
})();
</script>
</body></html>
