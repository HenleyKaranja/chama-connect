<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wallet — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:.25rem">Wallet</h1>
  <p style="color:var(--muted-foreground);margin-bottom:1.5rem">Your savings, deposits and withdrawals.</p>
  <div id="wallets" class="grid grid-cols-3 gap-4 mb-lg"></div>
  <div class="card"><h3 class="card-title">Recent transactions</h3><div id="txs">Loading…</div></div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
async function refresh() {
  const [wallets, txs] = await Promise.all([API.get("/api/wallets"), API.get("/api/wallet-transactions")]);
  document.getElementById("wallets").innerHTML = wallets.map(w => `
    <div class="card">
      <div style="color:var(--muted-foreground);font-size:.875rem">${escapeHtml(w.name)} · ${escapeHtml(w.type)}</div>
      <div style="font-size:1.75rem;font-weight:700;margin:.5rem 0">${fmtKES(w.balance)}</div>
      <div class="flex gap-2">
        <button class="btn btn-primary btn-sm" onclick="openDeposit('${w.id}')">Deposit</button>
        <button class="btn btn-outline btn-sm" onclick="openWithdraw('${w.id}')">Withdraw</button>
      </div>
    </div>`).join("");
  document.getElementById("txs").innerHTML = txs.length ? `<table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead><tbody>
    ${txs.map(t => `<tr><td>${fmtDateTime(t.created_at)}</td><td>${badge(t.type)}</td><td>${escapeHtml(t.description||"")}</td><td class="${t.type==='withdrawal'?'negative':''} font-semibold">${t.type==='withdrawal'?'-':'+'} ${fmtKES(t.amount)}</td></tr>`).join("")}
    </tbody></table>` : "<p style='color:var(--muted-foreground)'>No transactions.</p>";
}
function openDeposit(id) {
  showDetails("Deposit", `<div class="form-group"><label class="form-label">Amount</label><input id="amt" type="number" class="form-input" /></div>`,
    [{ label: "Cancel" }, { label: "Deposit", primary: true, onClick: `submitDeposit('${id}')` }]);
}
async function submitDeposit(id) {
  const amount = parseFloat(document.getElementById("amt").value);
  try { await API.post(`/api/wallets/${id}/deposit`, { amount }); document.getElementById("__detailsModal").style.display = "none"; showToast("Deposited", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
function openWithdraw(id) {
  showDetails("Withdraw", `<div class="form-group"><label class="form-label">Amount</label><input id="amt" type="number" class="form-input" /></div>`,
    [{ label: "Cancel" }, { label: "Withdraw", primary: true, onClick: `submitWithdraw('${id}')` }]);
}
async function submitWithdraw(id) {
  const amount = parseFloat(document.getElementById("amt").value);
  const rl = checkRate("withdraw", 3, 60_000); if (!rl.ok) return showToast(`Wait ${rl.retry}s`, "error");
  document.getElementById("__detailsModal").style.display = "none";
  const pin = await askPin(); if (!pin) return;
  try { await API.post(`/api/wallets/${id}/withdraw`, { amount, pin }); showToast("Withdrawal complete", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
(async () => { await Auth.requireAuth(); await mountShell("wallet"); refresh(); })();
</script>
</body></html>
