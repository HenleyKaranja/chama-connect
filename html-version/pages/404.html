<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Chama - Page Not Found</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div style="text-align: center; max-width: 500px;">
      <div style="font-size: 6rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">404</div>
      
      <h1 style="font-size: 2rem; margin-bottom: 1rem;">Page Not Found</h1>
      
      <p style="font-size: 1.1rem; color: var(--muted-foreground); margin-bottom: 2rem;">
        Sorry, the page you're looking for doesn't exist. It might have been moved or deleted.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
        <a href="dashboard.html" class="btn btn-primary btn-lg">Go to Dashboard</a>
        <a href="landing.html" class="btn btn-outline btn-lg">Back to Home</a>
      </div>

      <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
        <p style="font-size: 0.875rem; color: var(--muted-foreground);">
          Need help? <a href="mailto:support@m-chama.co.ke" style="color: var(--primary);">Contact Support</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
</body>
</html>
