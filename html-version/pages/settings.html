<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Settings — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-md" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:1.5rem">Settings</h1>

  <div class="card mb-lg">
    <h3 class="card-title">Profile</h3>
    <div class="form-group"><label class="form-label">Full name</label><input id="fn" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Phone</label><input id="ph" class="form-input" /></div>
    <button class="btn btn-primary" onclick="saveProfile()">Save</button>
  </div>

  <div class="card mb-lg">
    <h3 class="card-title">Transaction PIN</h3>
    <p style="color:var(--muted-foreground);font-size:.875rem;margin-bottom:.75rem">Required to authorize money-moving actions. <span id="pinStatus"></span></p>
    <div class="flex gap-2">
      <button class="btn btn-primary btn-sm" onclick="openSetPin()">Set / change PIN</button>
      <button class="btn btn-outline btn-sm" onclick="openResetPin()">Forgot PIN?</button>
    </div>
  </div>

  <div class="card mb-lg">
    <h3 class="card-title">Active sessions</h3>
    <div id="sessions">Loading…</div>
  </div>

  <div class="card">
    <h3 class="card-title">Theme</h3>
    <button class="btn btn-outline" onclick="themeToggle()">Toggle dark mode</button>
  </div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
async function load() {
  const me = await Auth.user() || await Auth.load();
  document.getElementById("fn").value = me.profile?.full_name || "";
  document.getElementById("ph").value = me.profile?.phone || "";
  document.getElementById("pinStatus").textContent = me.profile?.has_pin ? "✓ PIN is set." : "PIN not yet set.";
  const sessions = await API.get("/api/sessions");
  document.getElementById("sessions").innerHTML = sessions.length ? sessions.map(s => `
    <div class="flex justify-between items-center" style="padding:.5rem 0;border-bottom:1px solid var(--border)">
      <div><div class="font-medium">${escapeHtml(s.device_label||"Device")}</div>
        <div style="font-size:.75rem;color:var(--muted-foreground)">${escapeHtml(s.user_agent||"")}</div>
        <div style="font-size:.75rem;color:var(--muted-foreground)">Last seen ${fmtDateTime(s.last_seen_at)}</div></div>
      <button class="btn btn-outline btn-sm" onclick="revoke('${s.id}')">Revoke</button>
    </div>`).join("") : "<p style='color:var(--muted-foreground)'>No active sessions.</p>";
}
async function saveProfile() {
  try { await API.put("/api/profile", { full_name: document.getElementById("fn").value, phone: document.getElementById("ph").value }); showToast("Saved", "success"); }
  catch (e) { showToast(e.message, "error"); }
}
function openSetPin() {
  showDetails("Set PIN", `<div class="form-group"><label class="form-label">New PIN (4-6 digits)</label><input id="np" type="password" maxlength="6" class="form-input" /></div>`,
    [{ label: "Cancel" }, { label: "Save", primary: true, onClick: "submitPin()" }]);
}
async function submitPin() {
  try { await API.post("/api/auth/set-pin", { pin: document.getElementById("np").value }); document.getElementById("__detailsModal").style.display="none"; showToast("PIN updated","success"); load(); }
  catch (e) { showToast(e.message, "error"); }
}
function openResetPin() {
  showDetails("Reset PIN", `<p style="margin-bottom:1rem;font-size:.875rem">Confirm your account password to clear your PIN.</p>
    <div class="form-group"><label class="form-label">Password</label><input id="rp" type="password" class="form-input" /></div>`,
    [{ label: "Cancel" }, { label: "Reset", primary: true, onClick: "submitResetPin()" }]);
}
async function submitResetPin() {
  try { await API.post("/api/auth/reset-pin", { password: document.getElementById("rp").value }); document.getElementById("__detailsModal").style.display="none"; showToast("PIN cleared. Set a new one.","success"); load(); }
  catch (e) { showToast(e.message, "error"); }
}
async function revoke(id) { await API.del(`/api/sessions/${id}`); showToast("Session revoked","success"); load(); }
(async () => { await Auth.requireAuth(); await mountShell("settings"); load(); })();
</script>
</body></html>
