<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reports — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700">Reports</h1>
  <p style="color:var(--muted-foreground);margin-bottom:1.5rem">Aggregated insights and CSV exports.</p>
  <div id="stats" class="grid grid-cols-3 gap-4 mb-lg">Loading…</div>
  <div class="card"><h3 class="card-title">Exports</h3>
    <div class="flex gap-2 mt-md">
      <button class="btn btn-outline" onclick="exportCsv('contributions')">⬇ Contributions CSV</button>
      <button class="btn btn-outline" onclick="exportCsv('loans')">⬇ Loans CSV</button>
      <button class="btn btn-outline" onclick="exportCsv('wallet-transactions')">⬇ Transactions CSV</button>
    </div>
  </div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
async function load() {
  const [c, l, w] = await Promise.all([API.get("/api/contributions"), API.get("/api/loans"), API.get("/api/wallet-transactions")]);
  const totalContribs = c.filter(x => x.status === "paid").reduce((s,x) => s+Number(x.amount), 0);
  const totalLoans = l.reduce((s,x)=>s+Number(x.amount),0);
  const balance = w.reduce((s,t) => s + (t.type==="withdrawal" ? -Number(t.amount) : Number(t.amount)), 0);
  document.getElementById("stats").innerHTML = `
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Total contributions</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(totalContribs)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Total loans</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(totalLoans)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Net wallet flow</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(balance)}</div></div>`;
}
async function exportCsv(kind) {
  const path = kind === "wallet-transactions" ? "/api/wallet-transactions" : "/api/" + kind;
  const rows = await API.get(path);
  if (!rows.length) return showToast("Nothing to export", "info");
  const cols = Object.keys(rows[0]);
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => JSON.stringify(r[c] ?? "")).join(","))].join("\n");
  downloadMockFile(`${kind}-${new Date().toISOString().slice(0,10)}.csv`, csv, "text/csv");
}
(async () => { await Auth.requireAuth(); await mountShell("reports"); load(); })();
</script>
</body></html>
