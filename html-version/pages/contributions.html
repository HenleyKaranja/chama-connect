<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contributions — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <div class="flex justify-between items-center mb-lg">
    <div><h1 style="font-size:1.75rem;font-weight:700">Contributions</h1><p style="color:var(--muted-foreground)">Track and submit your contributions.</p></div>
    <button class="btn btn-primary" onclick="openContribute()">+ New contribution</button>
  </div>
  <div id="stats" class="grid grid-cols-3 gap-4 mb-lg"></div>
  <div class="card"><h3 class="card-title">My contributions</h3><div id="list">Loading…</div></div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
let chamas = [];
async function refresh() {
  const list = await API.get("/api/contributions");
  const paid = list.filter(c => c.status === "paid").reduce((s, c) => s + Number(c.amount), 0);
  const pending = list.filter(c => c.status === "pending").reduce((s, c) => s + Number(c.amount), 0);
  document.getElementById("stats").innerHTML = `
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Total paid</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(paid)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Pending</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(pending)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Count</div><div style="font-size:1.5rem;font-weight:700">${list.length}</div></div>`;
  document.getElementById("list").innerHTML = list.length ? `<table class="table"><thead><tr><th>Date</th><th>Chama</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody>
    ${list.map(c => `<tr><td>${fmtDate(c.created_at)}</td><td>${escapeHtml(c.chama_name || "—")}</td><td>${escapeHtml(c.payment_method)}</td><td class="font-semibold">${fmtKES(c.amount)}</td><td>${badge(c.status)}</td></tr>`).join("")}
    </tbody></table>` : "<p style='color:var(--muted-foreground)'>No contributions yet.</p>";
}
function openContribute() {
  showDetails("New contribution", `
    <div class="form-group"><label class="form-label">Chama</label>
      <select id="ch" class="form-input">${chamas.filter(c=>c.is_member).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
    <div class="form-group"><label class="form-label">Amount (KES)</label><input id="amt" type="number" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Method</label>
      <select id="pm" class="form-input"><option value="mpesa">M-Pesa</option><option value="bank">Bank</option><option value="cash">Cash (admin verification)</option></select></div>
    <div class="form-group"><label class="form-label">Notes</label><input id="nt" class="form-input" /></div>
  `, [{ label: "Cancel" }, { label: "Submit", primary: true, onClick: "submitContrib()" }]);
}
async function submitContrib() {
  const method = document.getElementById("pm").value;
  const amount = parseFloat(document.getElementById("amt").value);
  const chama_id = document.getElementById("ch").value;
  const notes = document.getElementById("nt").value;
  if (!amount || amount <= 0) return showToast("Invalid amount", "error");
  const rl = checkRate("contrib", 5, 60_000); if (!rl.ok) return showToast(`Wait ${rl.retry}s`, "error");
  document.getElementById("__detailsModal").style.display = "none";
  let pin = null;
  if (method !== "cash") { pin = await askPin(); if (!pin) return; }
  try {
    await API.post("/api/contributions", { chama_id, amount, payment_method: method, notes, pin });
    showToast(method === "cash" ? "Submitted for admin approval" : "Contribution paid", "success");
    refresh();
  } catch (e) { showToast(e.message, "error"); }
}
(async () => {
  await Auth.requireAuth(); await mountShell("contributions");
  chamas = await API.get("/api/chamas");
  refresh();
})();
</script>
</body></html>
