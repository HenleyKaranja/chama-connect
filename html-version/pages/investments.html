<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Investments — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700">Investments</h1>
  <p style="color:var(--muted-foreground);margin-bottom:1.5rem">Chama-scoped projects you can fund.</p>
  <div id="list" class="grid grid-cols-2 gap-4">Loading…</div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
async function refresh() {
  const projects = await API.get("/api/projects");
  document.getElementById("list").innerHTML = projects.length ? projects.map(p => {
    const pct = p.target_amount ? Math.min(100, Math.round(p.current_amount / p.target_amount * 100)) : 0;
    return `<div class="card">
      <h3 class="card-title">${escapeHtml(p.name)}</h3>
      <p style="color:var(--muted-foreground);font-size:.875rem">${escapeHtml(p.description||"")}</p>
      <div style="margin:.75rem 0"><div style="background:var(--muted);border-radius:999px;height:8px;overflow:hidden"><div style="background:var(--primary);height:100%;width:${pct}%"></div></div>
        <div class="flex justify-between mt-md" style="font-size:.875rem"><span>${fmtKES(p.current_amount)} raised</span><span>${fmtKES(p.target_amount)} goal · ${pct}%</span></div></div>
      <button class="btn btn-primary btn-sm" onclick="openContrib('${p.id}','${p.chama_id||''}')">Contribute</button>
    </div>`;
  }).join("") : "<p style='color:var(--muted-foreground)'>No projects.</p>";
}
function openContrib(id, chama_id) {
  showDetails("Contribute to project", `<div class="form-group"><label class="form-label">Amount</label><input id="amt" type="number" class="form-input" /></div>`,
    [{ label: "Cancel" }, { label: "Pay", primary: true, onClick: `submit('${id}','${chama_id}')` }]);
}
async function submit(id, chama_id) {
  const amount = parseFloat(document.getElementById("amt").value);
  document.getElementById("__detailsModal").style.display = "none";
  const pin = await askPin(); if (!pin) return;
  try { await API.post(`/api/projects/${id}/contribute`, { amount, chama_id, pin }); showToast("Thanks for investing!", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
(async () => { await Auth.requireAuth(); await mountShell("investments"); refresh(); })();
</script>
</body></html>
