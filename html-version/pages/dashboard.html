<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard — M-Chama</title>
<link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main">
  <div class="container container-lg" style="padding:2rem 1.5rem">
    <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:.25rem">Welcome back, <span id="userName">…</span></h1>
    <p style="color:var(--muted-foreground);margin-bottom:1.5rem">Here's what's happening in your chamas today.</p>
    <div class="grid grid-cols-4 gap-4 mb-lg" id="stats">…</div>
    <div class="grid grid-cols-2 gap-4">
      <div class="card"><h3 class="card-title">Recent contributions</h3><div id="contribs">Loading…</div></div>
      <div class="card"><h3 class="card-title">My chamas</h3><div id="chamas">Loading…</div></div>
    </div>
  </div>
</main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
(async () => {
  const me = await Auth.requireAuth();
  await mountShell("dashboard");
  document.getElementById("userName").textContent = me.profile?.full_name || me.user.email;

  const [wallets, contribs, chamas, notifs] = await Promise.all([
    API.get("/api/wallets"), API.get("/api/contributions"),
    API.get("/api/chamas"), API.get("/api/notifications"),
  ]);
  const balance = wallets.reduce((s, w) => s + Number(w.balance), 0);
  const unread = notifs.filter(n => !n.is_read).length;
  const myChamas = chamas.filter(c => c.is_member);

  document.getElementById("stats").innerHTML = `
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Wallet balance</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(balance)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Active chamas</div><div style="font-size:1.5rem;font-weight:700">${myChamas.length}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Contributions</div><div style="font-size:1.5rem;font-weight:700">${contribs.length}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Unread alerts</div><div style="font-size:1.5rem;font-weight:700">${unread}</div></div>`;

  document.getElementById("contribs").innerHTML = contribs.length ?
    contribs.slice(0, 5).map(c => `<div class="flex justify-between" style="padding:.5rem 0;border-bottom:1px solid var(--border)">
      <div><div class="font-medium">${escapeHtml(c.chama_name || "—")}</div><div style="font-size:.75rem;color:var(--muted-foreground)">${fmtDate(c.created_at)}</div></div>
      <div style="text-align:right"><div class="font-semibold">${fmtKES(c.amount)}</div>${badge(c.status)}</div></div>`).join("")
    : "<p style='color:var(--muted-foreground)'>No contributions yet.</p>";

  document.getElementById("chamas").innerHTML = myChamas.length ?
    myChamas.slice(0, 5).map(c => `<div class="flex justify-between" style="padding:.5rem 0;border-bottom:1px solid var(--border)">
      <div><div class="font-medium">${escapeHtml(c.name)}</div><div style="font-size:.75rem;color:var(--muted-foreground)">${escapeHtml(c.contribution_frequency)}</div></div>
      <div class="font-semibold">${fmtKES(c.total_savings)}</div></div>`).join("")
    : `<p style='color:var(--muted-foreground)'>You haven't joined any chama. <a href="/chamas.html">Browse</a>.</p>`;
})();
</script>
</body></html>
