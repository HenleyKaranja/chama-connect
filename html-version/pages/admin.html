<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700">Admin Dashboard</h1>
  <p style="color:var(--muted-foreground);margin-bottom:1.5rem">Approvals, members, audit and analytics.</p>

  <div id="stats" class="grid grid-cols-4 gap-4 mb-lg">Loading…</div>

  <div class="flex gap-2 mb-lg" style="flex-wrap:wrap">
    <button class="btn btn-outline btn-sm tab" data-tab="members" onclick="setTab('members')">Members</button>
    <button class="btn btn-outline btn-sm tab" data-tab="contribs" onclick="setTab('contribs')">Contributions</button>
    <button class="btn btn-outline btn-sm tab" data-tab="loans" onclick="setTab('loans')">Loans</button>
    <button class="btn btn-outline btn-sm tab" data-tab="penalties" onclick="setTab('penalties')">Penalties</button>
    <button class="btn btn-outline btn-sm tab" data-tab="cycles" onclick="setTab('cycles')">Cycles</button>
    <button class="btn btn-outline btn-sm tab" data-tab="audit" onclick="setTab('audit')">Audit</button>
  </div>

  <div class="card"><div id="tabContent">Loading…</div></div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
let tab = "members";
async function loadStats() {
  const s = await API.get("/api/admin/stats");
  document.getElementById("stats").innerHTML = `
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Members</div><div style="font-size:1.5rem;font-weight:700">${s.members}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Pending approvals</div><div style="font-size:1.5rem;font-weight:700">${s.pending_members}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Total savings</div><div style="font-size:1.5rem;font-weight:700">${fmtKES(s.total_savings)}</div></div>
    <div class="card"><div style="color:var(--muted-foreground);font-size:.875rem">Pending loans</div><div style="font-size:1.5rem;font-weight:700">${s.pending_loans}</div></div>`;
}
function setTab(t) {
  tab = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("btn-primary", b.dataset.tab === t));
  render();
}
async function render() {
  const el = document.getElementById("tabContent"); el.innerHTML = "Loading…";
  if (tab === "members") {
    const rows = await API.get("/api/admin/members");
    el.innerHTML = `<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${escapeHtml(r.full_name||"—")}</td><td>${escapeHtml(r.email)}</td>
        <td><select class="form-input" style="padding:.25rem;width:auto" onchange="setRole('${r.id}',this.value)">
          ${["member","treasurer","admin"].map(o=>`<option ${o===r.role?"selected":""}>${o}</option>`).join("")}</select></td>
        <td>${r.is_approved?badge("approved"):badge("pending")}</td>
        <td>${!r.is_approved?`<button class="btn btn-primary btn-sm" onclick="approveMember('${r.id}')">Approve</button>`:""}
            <button class="btn btn-outline btn-sm" onclick="rejectMember('${r.id}')">Reject</button></td></tr>`).join("")}
      </tbody></table>`;
  } else if (tab === "contribs") {
    const rows = await API.get("/api/contributions?all=1");
    el.innerHTML = `<table class="table"><thead><tr><th>Date</th><th>Member</th><th>Chama</th><th>Method</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${escapeHtml(r.full_name||"—")}</td><td>${escapeHtml(r.chama_name||"—")}</td>
        <td>${escapeHtml(r.payment_method)}</td><td>${fmtKES(r.amount)}</td><td>${badge(r.status)}</td>
        <td>${r.status==="pending"?`<button class="btn btn-primary btn-sm" onclick="approveContrib('${r.id}')">Approve</button>
            <button class="btn btn-outline btn-sm" onclick="rejectContrib('${r.id}')">Reject</button>`:""}</td></tr>`).join("")}
      </tbody></table>`;
  } else if (tab === "loans") {
    const rows = await API.get("/api/loans?all=1");
    el.innerHTML = `<table class="table"><thead><tr><th>Date</th><th>Member</th><th>Chama</th><th>Amount</th><th>Repaid</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${escapeHtml(r.full_name||"—")}</td><td>${escapeHtml(r.chama_name||"—")}</td>
        <td>${fmtKES(r.amount)}</td><td>${fmtKES(r.repaid_amount)}</td><td>${badge(r.status)}</td>
        <td>${r.status==="pending"?`<button class="btn btn-primary btn-sm" onclick="approveLoan('${r.id}')">Approve</button>
            <button class="btn btn-outline btn-sm" onclick="rejectLoan('${r.id}')">Reject</button>`:""}</td></tr>`).join("")}
      </tbody></table>`;
  } else if (tab === "penalties") {
    const rows = await API.get("/api/penalties?all=1");
    el.innerHTML = `<button class="btn btn-primary btn-sm mb-md" onclick="openPenalty()">+ Bill penalty</button>
      <table class="table"><thead><tr><th>Date</th><th>Member</th><th>Chama</th><th>Reason</th><th>Amount</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${escapeHtml(r.full_name||"—")}</td><td>${escapeHtml(r.chama_name||"—")}</td>
        <td>${escapeHtml(r.reason)}</td><td>${fmtKES(r.amount)}</td><td>${badge(r.status)}</td></tr>`).join("")}
      </tbody></table>`;
  } else if (tab === "cycles") {
    const rows = await API.get("/api/cycles");
    el.innerHTML = `<table class="table"><thead><tr><th>Chama</th><th>Cycle #</th><th>Recipient</th><th>Payout date</th><th>Amount</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${escapeHtml(r.chama_name||"—")}</td><td>${r.cycle_number}</td><td>${escapeHtml(r.recipient_name||"—")}</td>
        <td>${fmtDate(r.payout_date)}</td><td>${fmtKES(r.amount)}</td><td>${badge(r.status)}</td></tr>`).join("")}
      </tbody></table>`;
  } else if (tab === "audit") {
    const rows = await API.get("/api/admin/audit");
    el.innerHTML = `<table class="table"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${fmtDateTime(r.created_at)}</td><td>${escapeHtml(r.full_name||r.user_id.slice(0,8))}</td>
        <td>${escapeHtml(r.action)}</td><td>${escapeHtml(r.entity_type||"—")}</td><td><code style="font-size:.75rem">${escapeHtml(r.details||"")}</code></td></tr>`).join("")}
      </tbody></table>`;
  }
}
async function approveMember(id){ await API.put(`/api/admin/members/${id}/approve`); showToast("Approved","success"); render(); loadStats(); }
async function rejectMember(id){ const reason=prompt("Reason?"); if(!reason)return; await API.put(`/api/admin/members/${id}/reject`,{reason}); render(); }
async function setRole(id, role){ await API.put(`/api/admin/members/${id}/role`,{role}); showToast("Role updated","success"); }
async function approveContrib(id){ await API.put(`/api/contributions/${id}/approve`); showToast("Approved","success"); render(); loadStats(); }
async function rejectContrib(id){ const reason=prompt("Reason?"); if(!reason)return; await API.put(`/api/contributions/${id}/reject`,{reason}); render(); }
async function approveLoan(id){ await API.put(`/api/loans/${id}/approve`); showToast("Approved","success"); render(); loadStats(); }
async function rejectLoan(id){ const reason=prompt("Reason?"); if(!reason)return; await API.put(`/api/loans/${id}/reject`,{reason}); render(); }
async function openPenalty() {
  const [members, chamas] = await Promise.all([API.get("/api/admin/members"), API.get("/api/chamas")]);
  showDetails("Bill penalty", `
    <div class="form-group"><label class="form-label">Member</label><select id="pu" class="form-input">${members.map(m=>`<option value="${m.id}">${escapeHtml(m.full_name||m.email)}</option>`).join("")}</select></div>
    <div class="form-group"><label class="form-label">Chama</label><select id="pc" class="form-input">${chamas.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
    <div class="form-group"><label class="form-label">Amount</label><input id="pa" type="number" class="form-input" /></div>
    <div class="form-group"><label class="form-label">Reason</label><input id="pr" class="form-input" value="Missed contribution" /></div>
  `, [{label:"Cancel"},{label:"Bill",primary:true,onClick:"submitPenalty()"}]);
}
async function submitPenalty() {
  await API.post("/api/penalties", {
    user_id: document.getElementById("pu").value, chama_id: document.getElementById("pc").value,
    amount: parseFloat(document.getElementById("pa").value), reason: document.getElementById("pr").value,
  });
  document.getElementById("__detailsModal").style.display = "none"; showToast("Billed","success"); render();
}
(async () => { await Auth.requireRole("admin"); await mountShell("admin"); loadStats(); setTab("members"); })();
</script>
</body></html>
