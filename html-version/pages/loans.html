<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Loans — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <div class="flex justify-between items-center mb-lg">
    <div><h1 style="font-size:1.75rem;font-weight:700">Loans</h1><p style="color:var(--muted-foreground)">Apply, track and repay your loans.</p></div>
    <button class="btn btn-primary" onclick="openApply()">+ Apply for loan</button>
  </div>
  <div class="card"><h3 class="card-title">My loans</h3><div id="list">Loading…</div></div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
let chamas = [], loans = [];
async function refresh() {
  loans = await API.get("/api/loans");
  document.getElementById("list").innerHTML = loans.length ? `<table class="table"><thead><tr><th>Date</th><th>Chama</th><th>Amount</th><th>Repaid</th><th>Status</th><th></th></tr></thead><tbody>
    ${loans.map(l => `<tr><td>${fmtDate(l.created_at)}</td><td>${escapeHtml(l.chama_name||"—")}</td><td>${fmtKES(l.amount)}</td><td>${fmtKES(l.repaid_amount)}</td><td>${badge(l.status)}</td>
      <td>${l.status==="active"?`<button class="btn btn-outline btn-sm" onclick="openRepay('${l.id}',${l.amount},${l.repaid_amount})">Repay</button>`:""}</td></tr>`).join("")}
    </tbody></table>` : "<p style='color:var(--muted-foreground)'>No loans yet.</p>";
}
function openApply() {
  showDetails("Apply for loan", `
    <div class="form-group"><label class="form-label">Chama</label>
      <select id="lc" class="form-input">${chamas.filter(c=>c.is_member).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
    <div class="form-group"><label class="form-label">Amount (KES)</label><input id="la" type="number" class="form-input" /></div>
    <p style="font-size:.75rem;color:var(--muted-foreground)">Default interest rate: 10%. Subject to admin approval.</p>
  `, [{ label: "Cancel" }, { label: "Submit", primary: true, onClick: "submitApply()" }]);
}
async function submitApply() {
  const rl = checkRate("loanApply", 3, 5*60_000); if (!rl.ok) return showToast(`Wait ${rl.retry}s`, "error");
  try {
    await API.post("/api/loans", { chama_id: document.getElementById("lc").value, amount: parseFloat(document.getElementById("la").value) });
    document.getElementById("__detailsModal").style.display = "none";
    showToast("Application submitted", "success"); refresh();
  } catch (e) { showToast(e.message, "error"); }
}
function openRepay(id, total, repaid) {
  const balance = total - repaid;
  showDetails("Repay loan", `
    <p style="margin-bottom:1rem">Outstanding: <strong>${fmtKES(balance)}</strong></p>
    <div class="form-group"><label class="form-label">Amount</label><input id="ra" type="number" class="form-input" max="${balance}" /></div>
  `, [{ label: "Cancel" }, { label: "Pay", primary: true, onClick: `submitRepay('${id}')` }]);
}
async function submitRepay(id) {
  const amount = parseFloat(document.getElementById("ra").value);
  document.getElementById("__detailsModal").style.display = "none";
  const pin = await askPin(); if (!pin) return;
  try { await API.post(`/api/loans/${id}/repay`, { amount, pin }); showToast("Repayment recorded", "success"); refresh(); }
  catch (e) { showToast(e.message, "error"); }
}
(async () => {
  await Auth.requireAuth(); await mountShell("loans");
  chamas = await API.get("/api/chamas");
  refresh();
})();
</script>
</body></html>
