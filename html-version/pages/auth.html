<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Chama - Sign In / Sign Up</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background-color: var(--background);">
    <div style="width: 100%; max-width: 28rem;">
      <!-- Back Link -->
      <a href="landing.html" style="display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.9rem; color: var(--muted-foreground); text-decoration: none; margin-bottom: 2rem; transition: color 0.2s;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to home
      </a>

      <!-- Header -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="../logo.png" alt="M-Chama" style="height: 4rem; width: 4rem; margin: 0 auto 1rem; border-radius: calc(var(--radius) + 2px); object-fit: contain;">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">M-Chama</h1>
        <p id="form-subtitle" style="color: var(--muted-foreground);">Sign in to your account</p>
      </div>

      <!-- Form -->
      <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;" onsubmit="handleAuthSubmit(event)">
        <!-- Full Name (Signup only) -->
        <div id="name-group" class="form-group" style="display: none;">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="Amina Wanjiku">
        </div>

        <!-- Phone (Signup only) -->
        <div id="phone-group" class="form-group" style="display: none;">
          <label for="phone" class="required">Phone Number</label>
          <input type="tel" id="phone" placeholder="0712345678">
        </div>

        <!-- Role (Signup only) -->
        <div id="role-group" class="form-group" style="display: none;">
          <label for="role">Role</label>
          <select id="role">
            <option value="member">Member</option>
            <option value="admin">Admin / Chairperson</option>
          </select>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding-right: 2.5rem;">
            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility()" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-foreground); padding: 0; width: auto;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-eye">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-full" style="padding: 0.75rem; margin-top: 0.5rem;">
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <!-- Toggle Form Link -->
      <div style="text-align: center; margin-top: 1.5rem; color: var(--muted-foreground);">
        <span id="toggle-text">Don't have an account? </span>
        <a href="javascript:void(0)" onclick="toggleAuthMode()" style="color: var(--primary); font-weight: 600; text-decoration: none;">
          <span id="toggle-link">Create one</span>
        </a>
      </div>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 1rem; margin: 2rem 0; color: var(--muted-foreground);">
        <div style="flex: 1; height: 1px; background-color: var(--border);"></div>
        <span>or</span>
        <div style="flex: 1; height: 1px; background-color: var(--border);"></div>
      </div>

      <!-- Social Auth -->
      <button type="button" class="btn btn-outline btn-full" style="justify-content: center; padding: 0.75rem;" onclick="showToast('Redirecting to Google sign-in…','info');setTimeout(()=>location.href='dashboard.html',800);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.745 12.27c0-.79-.3-1.54-.81-2.1.01-.066.02-.132.02-.2a11.08 11.08 0 0 0-11.08-11.08c-3.85 0-7.26 2.2-8.96 5.43-3.06 1.21-5.19 4.16-5.19 7.65 0 4.63 3.74 8.38 8.38 8.38h10.79c3.85 0 6.97-3.12 6.97-6.97 0-3.5-2.54-6.44-5.88-6.97z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Terms -->
      <p style="text-align: center; font-size: 0.8rem; color: var(--muted-foreground); margin-top: 1.5rem;">
        By signing up, you agree to our <a href="javascript:showDetails(&apos;Terms of Service&apos;,&apos;<p>By using M-Chama you agree to abide by chama rules, contribute on schedule, and accept that withdrawals require admin approval. Penalties apply to missed payments per your chama settings.</p>&apos;)" style="color: var(--primary);">Terms</a> and <a href="javascript:showDetails(&apos;Privacy Policy&apos;,&apos;<p>We store your name, phone, and chama activity in Lovable Cloud. Data is encrypted in transit and at rest. We never share your information without consent.</p>&apos;)" style="color: var(--primary);">Privacy Policy</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script>
    let isLoginMode = true;

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      
      const nameGroup = document.getElementById('name-group');
      const phoneGroup = document.getElementById('phone-group');
      const roleGroup = document.getElementById('role-group');
      const formSubtitle = document.getElementById('form-subtitle');
      const btnText = document.getElementById('btn-text');
      const toggleText = document.getElementById('toggle-text');
      const toggleLink = document.getElementById('toggle-link');
      const emailInput = document.getElementById('email');

      if (isLoginMode) {
        nameGroup.style.display = 'none';
        phoneGroup.style.display = 'none';
        roleGroup.style.display = 'none';
        formSubtitle.textContent = 'Sign in to your account';
        btnText.textContent = 'Sign In';
        toggleText.textContent = "Don't have an account? ";
        toggleLink.textContent = 'Create one';
        emailInput.removeAttribute('required');
      } else {
        nameGroup.style.display = 'block';
        phoneGroup.style.display = 'block';
        roleGroup.style.display = 'block';
        formSubtitle.textContent = 'Create your account';
        btnText.textContent = 'Create Account';
        toggleText.textContent = 'Already have an account? ';
        toggleLink.textContent = 'Sign in';
        emailInput.setAttribute('required', 'required');
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const iconEye = document.getElementById('icon-eye');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconEye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passwordInput.type = 'password';
        iconEye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function handleAuthSubmit(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      if (isLoginMode) {
        showToast('Welcome back! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } else {
        const fullName = document.getElementById('full-name').value;
        const phone = document.getElementById('phone').value;

        if (!fullName || !phone) {
          showToast('Please fill in all fields', 'error');
          return;
        }

        showToast('Account created successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      }
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'signup') {
      toggleAuthMode();
    }
  </script>
</body>
</html>
