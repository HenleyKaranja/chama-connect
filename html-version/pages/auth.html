<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in — M-Chama</title>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--muted)">
<div class="card" style="max-width:420px;width:100%;margin:1rem">
  <div style="text-align:center;margin-bottom:1.5rem">
    <div class="nav-brand-icon" style="width:48px;height:48px;font-size:1.5rem;margin:0 auto .75rem">M</div>
    <h1 style="font-size:1.5rem;font-weight:700">M-Chama</h1>
    <p style="color:var(--muted-foreground);font-size:.875rem" id="subtitle">Sign in to continue</p>
  </div>

  <div class="flex" style="border:1px solid var(--border);border-radius:.5rem;padding:.25rem;margin-bottom:1rem">
    <button id="tabLogin" class="btn btn-primary btn-sm" style="flex:1" onclick="setTab('login')">Sign in</button>
    <button id="tabSignup" class="btn btn-outline btn-sm" style="flex:1;border:none" onclick="setTab('signup')">Sign up</button>
  </div>

  <form id="authForm" onsubmit="return submitAuth(event)">
    <div class="form-group" id="nameGroup" style="display:none">
      <label class="form-label">Full name</label>
      <input id="fullName" class="form-input" placeholder="Jane Mwangi" />
    </div>
    <div class="form-group" id="phoneGroup" style="display:none">
      <label class="form-label">Phone (+254...)</label>
      <input id="phone" class="form-input" placeholder="+254700000000" />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="email" type="email" class="form-input" required />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-input" required minlength="8" />
    </div>
    <div class="form-group" id="roleGroup" style="display:none">
      <label class="form-label">Role</label>
      <select id="role" class="form-input">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" id="submitBtn">Sign in</button>
    <p style="margin-top:1rem;font-size:.75rem;color:var(--muted-foreground);text-align:center">
      Demo: admin@mchama.test / admin1234 — member@mchama.test / member1234
    </p>
  </form>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script>
<script>
let mode = "login";
function setTab(m) {
  mode = m;
  document.getElementById("tabLogin").className = "btn btn-sm " + (m === "login" ? "btn-primary" : "btn-outline");
  document.getElementById("tabSignup").className = "btn btn-sm " + (m === "signup" ? "btn-primary" : "btn-outline");
  document.getElementById("nameGroup").style.display = m === "signup" ? "" : "none";
  document.getElementById("phoneGroup").style.display = m === "signup" ? "" : "none";
  document.getElementById("roleGroup").style.display = m === "signup" ? "" : "none";
  document.getElementById("submitBtn").textContent = m === "signup" ? "Create account" : "Sign in";
  document.getElementById("subtitle").textContent = m === "signup" ? "Create your account" : "Sign in to continue";
}
async function submitAuth(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    if (mode === "login") {
      const rl = checkRate("login:" + email, 5, 60_000);
      if (!rl.ok) { showToast(`Too many attempts. Wait ${rl.retry}s.`, "error"); return false; }
      await Auth.login(email, password);
    } else {
      await Auth.signup({
        email, password,
        full_name: document.getElementById("fullName").value.trim(),
        phone: document.getElementById("phone").value.trim() || null,
        role: document.getElementById("role").value,
      });
    }
    location.href = "/dashboard.html";
  } catch (err) { showToast(err.message, "error"); }
  return false;
}
</script>
</body>
</html>
