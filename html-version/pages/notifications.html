<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Notifications — M-Chama</title><link rel="stylesheet" href="/assets/css/style.css" />
</head><body>
<main class="layout-main"><div class="container container-lg" style="padding:2rem 1.5rem">
  <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:1.5rem">Notifications</h1>
  <div id="list" class="grid gap-3">Loading…</div>
</div></main>
<script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script>
<script src="/assets/js/app.js"></script><script src="/assets/js/lib.js"></script>
<script>
async function refresh() {
  const items = await API.get("/api/notifications");
  document.getElementById("list").innerHTML = items.length ? items.map(n => `
    <div class="card" style="${n.is_read ? 'opacity:.65' : ''}">
      <div class="flex justify-between items-start">
        <div><div class="font-semibold">${escapeHtml(n.title)}</div>
          <div style="color:var(--muted-foreground);font-size:.875rem">${escapeHtml(n.message)}</div>
          <div style="font-size:.75rem;color:var(--muted-foreground);margin-top:.25rem">${fmtDateTime(n.created_at)}</div></div>
        ${badge(n.type)}
      </div>
      ${!n.is_read ? `<button class="btn btn-outline btn-sm mt-md" onclick="mark('${n.id}')">Mark as read</button>` : ""}
    </div>`).join("") : "<p style='color:var(--muted-foreground)'>No notifications.</p>";
}
async function mark(id) { await API.put(`/api/notifications/${id}/read`); refresh(); }
(async () => { await Auth.requireAuth(); await mountShell("notifications"); refresh(); })();
</script>
</body></html>
